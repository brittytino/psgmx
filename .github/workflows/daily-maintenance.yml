name: Daily Companion Maintenance

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh readiness, lifecycle, birthdays, and OTP audit retention
        env:
          APP_URL: ${{ vars.APP_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          APP_URL="${APP_URL:-https://www.psgmx.tech}"
          APP_URL="${APP_URL%/}"
          if [ "$APP_URL" = "https://psgmx.tech" ]; then APP_URL="https://www.psgmx.tech"; fi

          status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --output /tmp/maintenance.json --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$APP_URL/api/cron/daily-maintenance")
          cat /tmp/maintenance.json
          test "$status" = "200"
