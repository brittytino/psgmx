name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - dev
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Validate configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_API_URL: ${{ vars.APP_API_URL }}
        run: |
          APP_API_URL="${APP_API_URL:-https://www.psgmx.tech}"
          test -n "$SUPABASE_URL"    || { echo "❌ Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "❌ Missing SUPABASE_ANON_KEY secret"; exit 1; }
          echo "✅ Secrets validated"

      - name: Generate Environment File
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_API_URL: ${{ vars.APP_API_URL }}
        run: |
          APP_API_URL="${APP_API_URL:-https://www.psgmx.tech}"
          APP_API_URL="${APP_API_URL%/}"
          # Normalize legacy / test URLs → canonical production URL
          case "$APP_API_URL" in
            "https://psgmx.tech" | "https://app.psgmx.tech" | \
            "https://psgmxians.web.app" | "https://psgmxians.firebaseapp.com")
              APP_API_URL="https://www.psgmx.tech"
              ;;
          esac
          echo "🌐 APP_API_URL=$APP_API_URL"
          umask 077
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nAPP_API_URL=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$APP_API_URL" > .env.flutter

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test (unit + widget, skip integration)
        run: flutter test --exclude-tags=integration
        continue-on-error: false

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --dart-define-from-file=.env.flutter \
            --web-renderer canvaskit \
            --pwa-strategy offline-first
          echo "✅ Web build complete — $(du -sh build/web | cut -f1)"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PSGMXIANS }}
          channelId: live
          projectId: psgmxians
          entryPoint: apps/mobile
