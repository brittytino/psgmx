name: Release PSGMX Mobile
# Release branches produce installable verification artifacts. Version tags
# additionally publish those artifacts as a GitHub Release.
# PRD Appendix A decision 6: Android APK distributed via GitHub Releases only.
# Push v4.2.0 -> builds and publishes signed APKs.
# See: docs/user-flow.md Chapter 11.6

on:
  push:
    branches:
      - 'release/*'  # e.g. release/v4.2.0
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mobile:
    name: Build signed Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_API_URL: ${{ vars.APP_API_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APP_API_URL="${APP_API_URL:-https://www.psgmx.tech}"
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD secret"; exit 1; }

      - name: Create mobile environment file
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_API_URL: ${{ vars.APP_API_URL }}
        run: |
          APP_API_URL="${APP_API_URL:-https://www.psgmx.tech}"
          APP_API_URL="${APP_API_URL%/}"
          if [ "$APP_API_URL" = "https://psgmx.tech" ]; then
            APP_API_URL="https://www.psgmx.tech"
          fi
          umask 077
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nAPP_API_URL=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$APP_API_URL" > .env.flutter

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/psgmx-upload-keystore.jks"

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: apps/mobile
        run: dart run build_runner build

      - name: Resolve release version
        id: version
        working-directory: apps/mobile
        run: |
          PACKAGE_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          BUILD_NAME="${PACKAGE_VERSION%%+*}"
          EXPECTED_TAG="v$BUILD_NAME"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $EXPECTED_TAG"
            exit 1
          fi

          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --fatal-warnings

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build signed APKs
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/psgmx-upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p release-artifacts

          flutter build apk --release \
            --dart-define-from-file=.env.flutter \
            --build-name="${{ steps.version.outputs.build_name }}" \
            --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-artifacts/PSGMX-${{ steps.version.outputs.release_tag }}-android.apk"

          flutter build apk --release --split-per-abi \
            --dart-define-from-file=.env.flutter \
            --build-name="${{ steps.version.outputs.build_name }}" \
            --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "release-artifacts/PSGMX-${{ steps.version.outputs.release_tag }}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "release-artifacts/PSGMX-${{ steps.version.outputs.release_tag }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "release-artifacts/PSGMX-${{ steps.version.outputs.release_tag }}-x86_64.apk"

      - name: Build Flutter web client
        working-directory: apps/mobile
        run: flutter build web --release --dart-define-from-file=.env.flutter

      - name: Package release artifacts
        run: |
          cd apps/mobile/build/web
          zip -r ../../../../psgmx-flutter-web-build.zip .
          cd ../../../../
          sha256sum \
            apps/mobile/release-artifacts/*.apk \
            psgmx-flutter-web-build.zip > SHA256SUMS.txt

      - name: Upload APK verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psgmx-${{ github.ref_name }}-android
          path: |
            apps/mobile/release-artifacts/*.apk
            psgmx-flutter-web-build.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PSGMX ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## PSGMX ${{ github.ref_name }}

            ### 🚀 What's New
            - **Screen Security** — screenshot / screen-recording prevention on Android
            - **Journey Archive** — browse and replay past journey entries
            - **Adaptive Sprint System** — real-time difficulty adjustment with persistent revisit queues
            - **Push Notifications** — sprint reminders, placement alerts, and announcements
            - **Live Search Spotlight** — instant autocomplete across student portal & Knowledge Brain
            - **Real-time Notifications** — zero-static-data Supabase Realtime pipeline
            - **Historical Alumni Migration** — full lineage graph for batches 19MX–24MX
            - **Community & Squad Expansion** — leaderboard, peer-challenge flows, and feed improvements

            ### 📲 Installation
            Download **PSGMX-${{ github.ref_name }}-android.apk** for the universal build (recommended for most devices).
            Device-specific APKs (`armeabi-v7a`, `arm64-v8a`, `x86_64`) are included for smaller installs.

            SHA-256 checksums are provided in `SHA256SUMS.txt` for integrity verification.

            > **Web app**: Live at https://www.psgmx.tech · Firebase PWA at https://psgmxians.web.app
          files: |
            apps/mobile/release-artifacts/*.apk
            psgmx-flutter-web-build.zip
            SHA256SUMS.txt
