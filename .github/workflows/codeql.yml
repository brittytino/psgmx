# CodeQL Analysis
#
# ⚠️  THIS WORKFLOW IS INTENTIONALLY DISABLED.
#
# This repository uses GitHub's built-in "Default Setup" for Code Scanning
# (Settings → Security → Code scanning → Default setup).
#
# Having BOTH a custom CodeQL Actions workflow AND Default Setup enabled causes:
#   "CodeQL analyses from advanced configurations cannot be processed
#    when the default setup is enabled"
#
# Since Default Setup automatically scans all JavaScript/TypeScript files on
# every push and PR, this custom workflow is redundant and has been disabled.
#
# To re-enable custom configuration: first disable Default Setup in
# GitHub repo Settings → Security → Code scanning → Default setup → Disable.

name: "CodeQL Analysis (Disabled)"

on:
  workflow_dispatch: # Manual trigger only — disabled from push/PR
