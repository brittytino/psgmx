name: Knowledge Review Scheduling

# Flags Knowledge Brain content older than 18 months for re-review.
# Runs every Monday at 09:00 AM IST (03:30 UTC).
# Replaces pg_cron (Supabase Pro feature) — free alternative via GitHub Actions.
# See: docs/user-flow.md Chapter 7.3, 11.3, 13.3

on:
  schedule:
    - cron: '30 3 * * 1'  # Every Monday 09:00 AM IST (03:30 UTC)
  workflow_dispatch:      # Allow manual trigger

jobs:
  knowledge-review:
    name: Flag stale approved knowledge for review
    runs-on: ubuntu-latest
    steps:
      - name: Flag stale approved knowledge for review
        env:
          APP_URL: ${{ vars.APP_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          HTTP_STATUS=$(curl --location --silent --show-error -o /tmp/review_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/knowledge-review")

          echo "Knowledge review reminder HTTP status: $HTTP_STATUS"
          cat /tmp/review_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: knowledge-review-reminder returned $HTTP_STATUS"
            exit 1
          fi

          echo "Knowledge review scheduling completed successfully."
