name: Knowledge Review Reminder & Weekly Digest

# Flags Knowledge Brain content older than 18 months for re-review.
# Sends weekly digest emails to active students via Resend.
# Runs every Monday at 09:00 AM IST (03:30 UTC).
# Replaces pg_cron (Supabase Pro feature) — free alternative via GitHub Actions.
# See: docs/user-flow.md Chapter 7.3, 11.3, 13.3

on:
  schedule:
    - cron: '30 3 * * 1'  # Every Monday 09:00 AM IST (03:30 UTC)
  workflow_dispatch:      # Allow manual trigger

jobs:
  knowledge-review:
    name: Flag stale knowledge and trigger weekly digests
    runs-on: ubuntu-latest
    steps:
      - name: Call knowledge-review-reminder Edge Function
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/review_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/knowledge-review-reminder")

          echo "Knowledge review reminder HTTP status: $HTTP_STATUS"
          cat /tmp/review_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: knowledge-review-reminder returned $HTTP_STATUS"
            exit 1
          fi

          echo "Knowledge review reminder and weekly digest completed successfully."
