name: Freshness Daemon

# Applies evidence age penalties to student readiness scores.
# Runs every Sunday at 10:00 AM IST (04:30 UTC).
# Replaces pg_cron (Supabase Pro feature) — free alternative via GitHub Actions.
# See: docs/user-flow.md Chapter 5.3

on:
  schedule:
    - cron: '30 4 * * 0'  # Every Sunday 10:00 AM IST
  workflow_dispatch:

jobs:
  freshness:
    name: Apply evidence age penalties to readiness scores
    runs-on: ubuntu-latest
    steps:
      - name: Call freshness-daemon Edge Function
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/freshness_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/freshness-daemon")

          echo "Freshness daemon HTTP status: $HTTP_STATUS"
          cat /tmp/freshness_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: freshness-daemon returned $HTTP_STATUS"
            exit 1
          fi

          echo "Freshness daemon completed successfully."
