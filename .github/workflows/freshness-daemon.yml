name: Freshness Daemon

# Reclassifies readiness evidence confidence as it ages. Scores are never
# repeatedly reduced by a scheduled job; the readiness engine consumes the
# confidence label when it computes the next versioned snapshot.
# Runs every Sunday at 10:00 AM IST (04:30 UTC).
# Replaces pg_cron (Supabase Pro feature) — free alternative via GitHub Actions.
# See: docs/user-flow.md Chapter 5.3

on:
  schedule:
    - cron: '30 4 * * 0'  # Every Sunday 10:00 AM IST
  workflow_dispatch:

jobs:
  freshness:
    name: Reclassify readiness evidence confidence
    runs-on: ubuntu-latest
    steps:
      - name: Refresh evidence confidence
        env:
          APP_URL: ${{ vars.APP_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          HTTP_STATUS=$(curl --location --silent --show-error -o /tmp/freshness_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/freshness")

          echo "Freshness daemon HTTP status: $HTTP_STATUS"
          cat /tmp/freshness_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: freshness-daemon returned $HTTP_STATUS"
            exit 1
          fi

          echo "Freshness daemon completed successfully."
