name: Supabase Keepalive

# Prevents the Supabase free tier project from pausing due to inactivity.
# Supabase free projects pause after 1 week of no database queries.
# This workflow runs every Sunday at 08:00 AM IST (02:30 UTC) and pings
# the keepalive Edge Function, which does a lightweight SELECT 1.
# See: docs/user-flow.md Chapter 0.4

on:
  schedule:
    - cron: '30 2 * * 0'  # Every Sunday 08:00 AM IST (UTC+5:30 = UTC-5.5h)
  workflow_dispatch:      # Allow manual trigger

jobs:
  keepalive:
    name: Ping Supabase to prevent free tier pause
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/keepalive")

          echo "Keepalive HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Keepalive ping returned $HTTP_STATUS. Check SUPABASE_URL and CRON_SECRET secrets."
            exit 1
          fi

          echo "Supabase project is active."
