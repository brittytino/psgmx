name: psgmx_mobile
description: Placement Preparation Program App for PSG Technology - MCA. A comprehensive platform for placement tracking, LeetCode integration, and student management.
publish_to: 'none'
version: 4.2.0+3
homepage: https://www.psgmx.tech
repository: https://github.com/brittytino/psgmx
issue_tracker: https://github.com/brittytino/psgmx/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Required by a transitive Material navigation component's icon data.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  provider: ^6.1.1
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  http: ^1.1.2
  http_parser: ^4.1.2
  record: ^7.1.1
  url_launcher: ^6.2.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0
  package_info_plus: ^10.1.0
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.14+2
  pinput: ^6.0.2
  flutter_native_splash: ^2.4.0
  dicebear_core: ^10.3.0
  dicebear_styles: ^10.2.0
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.34.4
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/splash/
    - assets/images/exam/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FF6B6B"

flutter_native_splash:
  color: "#FAFAFA"
  image: "assets/images/logo.png"
  android_12:
    color: "#FAFAFA"
    image: "assets/images/logo.png"
