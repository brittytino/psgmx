<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PSGMX - Placement Excellence Companion for PSG College of Technology MCA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PSGMX">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>PSGMX - Placement Readiness Companion</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #FBF6EE;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      color: #221F1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 90, 31, 0.2);
      border-top-color: #FF5A1F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">PSG<span style="color: #FF5A1F;">MX</span></div>
    <div style="font-size: 13px; color: #94A3B8; margin-top: 4px;">Loading Placement Companion...</div>
  </div>

  <script>
    // ── Standalone / PWA detection helper for iOS & all modern browsers ────────
    window.isAppStandalone = function() {
      try {
        var isIosStandalone = Boolean(window.navigator && window.navigator.standalone === true);
        var isMediaStandalone = Boolean(window.matchMedia && (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches
        ));
        var hasPwaQuery = Boolean(
          window.location && (
            window.location.search.indexOf('source=pwa') !== -1 ||
            window.location.search.indexOf('mode=standalone') !== -1
          )
        );
        return isIosStandalone || isMediaStandalone || hasPwaQuery;
      } catch (e) {
        return false;
      }
    };

    // ── Immediate Service Worker & Cache cleanup ───────────────────────────
    // Preemptively purge active service workers and CacheStorage to prevent
    // WebKit WebContent process termination and crash loops on iOS.
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    } catch (e) {}

    // ── CanvasKit memory limits ─────────────────────────────────────────────
    // iOS Safari enforces a strict per-tab GPU/memory budget. These settings
    // reduce the number of concurrent CanvasKit surfaces and disable features
    // that create additional GPU contexts, preventing the blank-screen crash.
    window.flutterConfiguration = {
      canvasKitMaximumSurfaces: 1,
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
